name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make check (format, lint, vet, tests with -race, coverage >= 80%)
        run: make check
      - name: make demo (offline end-to-end run)
        run: make demo

  # Example of using planprice itself on a pull request: price the plans
  # bundled in testdata and fail the job if the increase exceeds a budget.
  # In a real repository you would run `terraform plan` + `terraform show
  # -json` for the base and head commits instead.
  cost-gate-example:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o bin/planprice ./cmd/planprice
      - name: Cost diff as Markdown (would be posted as a PR comment)
        run: |
          ./bin/planprice diff \
            --base testdata/plans/base.json --head testdata/plans/head.json \
            --usage examples/usage.yml --format markdown --out cost-diff.md
          cat cost-diff.md >> "$GITHUB_STEP_SUMMARY"
